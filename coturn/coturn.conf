# ============================================================================
# HEYORA COTURN SERVER CONFIGURATION (coturn.conf)
# Target: Low-Cost VPS ($4 - $10/mo e.g. Hetzner, DigitalOcean, Linode)
# ============================================================================

# Network & Listening Ports
listening-port=3478
tls-listening-port=5349
alt-listening-port=3479
alt-tls-listening-port=5350

# Listening IPs (0.0.0.0 binds to all available interfaces)
listening-ip=0.0.0.0

# External Public IP of your VPS (Replace with your server's public IP)
# external-ip=YOUR_SERVER_PUBLIC_IP

# Relay Ports Range (UDP relay ports for strict carrier NAT calls)
min-port=49152
max-port=65535

# Verbose logging (comment out in high-load production)
verbose
fingerprint
lt-cred-mech

# Realm & Server Name
realm=turn.heyora.app
server-name=turn.heyora.app

# TURN REST API (HMAC-SHA1 time-limited temporary credentials)
# Matches the secret configured in Supabase RPC get_turn_credentials()
use-auth-secret
static-auth-secret=heyora_coturn_super_secret_shared_key_2026

# Performance & Security
stale-nonce=600
no-stdout-log
log-file=/var/log/coturn/turnserver.log
simple-log

# Do not allow loopback addresses for relay security
no-loopback-peers
no-multicast-peers

# TLS Certificates (Use Let's Encrypt certbot for free SSL)
# cert=/etc/letsencrypt/live/turn.heyora.app/fullchain.pem
# pkey=/etc/letsencrypt/live/turn.heyora.app/privkey.pem
# cipher-list="ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384"
